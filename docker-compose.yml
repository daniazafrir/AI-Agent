services:
  postgres:
    image: postgres:17
    container_name: agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d agent_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage


  agent-api:
    container_name: agent-api
    restart: unless-stopped

    build:
      context: ./src
      dockerfile: Agent.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: gpt-4.1-mini
      OpenAI__MaxToolRounds: "3"

      ConnectionStrings__AgentDatabase: >
        Host=postgres;
        Port=5432;
        Database=agent_db;
        Username=postgres;
        Password=${POSTGRES_PASSWORD:-postgres}

      Mcp__ServerUrl: http://host.docker.internal:5100/mcp

      AllowedOrigins__0: http://localhost:4200

    ports:
      - "5001:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:
  qdrant-data: