<div
    class="chat-layout"
    [class.debug-collapsed]="isDebugCollapsed()">

<main class="chat-page">
    <header class="chat-header">
        <div>
            <p class="eyebrow">AI AGENT</p>
            <h1>Agent Assistant</h1>
            <p class="subtitle">
                Angular + .NET + OpenAI + MCP + RAG
            </p>
        </div>

        <button type="button" class="new-chat-button" (click)="clearConversation()" [disabled]="state.isSending()">

            שיחה חדשה
        </button>
    </header>

    <section class="knowledge-section">

        <app-document-upload />

        <div class="knowledge-divider"></div>

        <app-knowledge-base />

    </section>


  
    <section class="conversation-area">
        @if (state.activeTool()) {
        <div class="tool-status">
            <div class="tool-status-spinner"></div>

            <span class="tool-status-icon">
                {{ getToolIcon(state.activeTool()) }}
            </span>

            <span>
                {{ getToolText(state.activeTool()) }}
            </span>
        </div>
        }

        <app-message-list />

        @if (state.isSending()) {
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
        }

        @if (state.error()) {
        <p class="error-status">
            {{ state.error() }}
        </p>
        }
    </section>

    <app-composer [loading]="state.isSending()" (send)="sendMessage($event)" (stop)="stopGeneration()">
    </app-composer>
</main>
<app-debug-panel
    [history]="state.requestHistory()"
    [debug]="state.debugInfo()"
    [sourceCount]="state.messages().at(-1)?.sources?.length ?? 0"
    [collapsed]="isDebugCollapsed()"
    (collapsedChange)="setDebugCollapsed($event)"
  />
</div>
