<div class="composer-shell">

  <textarea
    rows="2"
    dir="auto"
    placeholder="שאל משהו..."
    [formControl]="message"
    [disabled]="loading()"
    (keydown)="onKeyDown($event)">
  </textarea>

  <button
    type="button"
    class="attach-button"
    aria-label="Attach document">

    <mat-icon>
      attach_file
    </mat-icon>

  </button>

  <div class="composer-actions">

    @if (!loading()) {

      <button
        type="button"
        mat-flat-button
        class="send-button"
        [disabled]="message.invalid"
        (click)="submit()">

        <mat-icon>send</mat-icon>

      </button>

    } @else {

      <button
        type="button"
        mat-flat-button
        class="stop-button"
        (click)="stopGeneration()">

        <mat-icon>stop</mat-icon>

      </button>

    }

  </div>

  <div class="composer-hint">
    Enter לשליחה · Shift+Enter לשורה חדשה
  </div>

</div>
